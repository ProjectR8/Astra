<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05080d;
  --panel:#0b1119;
  --panel2:#101923;
  --line:#1d3345;
  --text:#e8f4ff;
  --muted:#7892a7;
  --cyan:#00d9ff;
  --cyan2:#008cff;
  --green:#00ff9d;
  --red:#ff5364;
  --yellow:#ffd166;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,rgba(0,217,255,.08),transparent 35%),
    linear-gradient(135deg,#03060a,#08111a 55%,#03060a);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

.app{
  height:100vh;
  display:grid;
  grid-template-columns:280px 1fr 300px;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid var(--line);
  background:rgba(5,10,16,.9);
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:23px;
  font-weight:800;
  color:var(--cyan);
  letter-spacing:2px;
}

.logo-dot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 20px var(--cyan);
}

.status{
  padding:15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(10,20,30,.7);
}

.status-title{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.status-value{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--green);
  font-weight:bold;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:12px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.nav button:hover,
.nav button.active{
  color:var(--cyan);
  background:rgba(0,217,255,.07);
  border-color:rgba(0,217,255,.18);
}

.profile{
  margin-top:auto;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
}

.profile-name{
  font-weight:bold;
  margin-bottom:5px;
}

.profile-city{
  color:var(--muted);
  font-size:12px;
}

/* CENTER */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.header{
  height:70px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.header-title{
  font-weight:bold;
  letter-spacing:1px;
}

.header-status{
  color:var(--muted);
  font-size:12px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

.chat::-webkit-scrollbar{
  width:7px;
}

.chat::-webkit-scrollbar-thumb{
  background:#1a3447;
  border-radius:20px;
}

.welcome{
  max-width:700px;
  margin:80px auto;
  text-align:center;
}

.arc{
  width:120px;
  height:120px;
  margin:0 auto 30px;
  border-radius:50%;
  border:2px solid var(--cyan);
  box-shadow:
    0 0 20px rgba(0,217,255,.3),
    inset 0 0 30px rgba(0,217,255,.08);
  position:relative;
  animation:pulse 3s infinite;
}

.arc:before,
.arc:after{
  content:"";
  position:absolute;
  inset:15px;
  border-radius:50%;
  border:1px dashed rgba(0,217,255,.5);
}

.arc:after{
  inset:35px;
  border-style:solid;
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.05);opacity:1}
}

.welcome h1{
  font-size:34px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  line-height:1.6;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;
  padding:14px 17px;
  border-radius:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .bubble{
  background:linear-gradient(135deg,#075b72,#06415c);
  border:1px solid rgba(0,217,255,.3);
}

.message.ai .bubble{
  background:#0d1721;
  border:1px solid var(--line);
}

.message.error .bubble{
  background:rgba(255,83,100,.08);
  border-color:rgba(255,83,100,.3);
  color:#ffb6bd;
}

.typing{
  display:flex;
  gap:5px;
  align-items:center;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--cyan);
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{opacity:.2;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-4px)}
}

/* INPUT */

.input-area{
  padding:18px 25px 24px;
  border-top:1px solid var(--line);
  background:rgba(5,10,16,.9);
}

.input-wrap{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:10px;
}

.input{
  flex:1;
  min-width:0;
  resize:none;
  height:54px;
  max-height:150px;
  padding:16px;
  border-radius:13px;
  border:1px solid var(--line);
  outline:none;
  background:#0b131d;
  color:var(--text);
  font-size:15px;
}

.input:focus{
  border-color:rgba(0,217,255,.5);
  box-shadow:0 0 20px rgba(0,217,255,.06);
}

.btn{
  width:54px;
  height:54px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0c1721;
  color:var(--cyan);
  cursor:pointer;
  font-size:20px;
}

.btn:hover{
  background:#102332;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.send{
  background:linear-gradient(135deg,#008cff,#00c6df);
  color:#001018;
  border:none;
  font-weight:bold;
}

/* RIGHT */

.rightbar{
  border-left:1px solid var(--line);
  background:rgba(5,10,16,.9);
  padding:20px;
  overflow:auto;
}

.card{
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(10,18,27,.75);
  padding:16px;
  margin-bottom:15px;
}

.card-title{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:12px;
  letter-spacing:1px;
}

.clock{
  font-size:32px;
  font-weight:bold;
  color:var(--cyan);
}

.date{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.weather{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.temp{
  font-size:32px;
  font-weight:bold;
}

.weather-info{
  text-align:right;
  color:var(--muted);
  font-size:12px;
}

.reminder{
  padding:10px;
  border-radius:9px;
  background:#0b1620;
  border:1px solid #173042;
  margin-bottom:8px;
}

.reminder-time{
  color:var(--cyan);
  font-size:12px;
  margin-bottom:4px;
}

.small-btn{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:7px 10px;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

.small-btn:hover{
  color:var(--red);
  border-color:rgba(255,83,100,.3);
}

/* SETTINGS MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,92vw);
  max-height:90vh;
  overflow:auto;
  padding:25px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#09111a;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal-box h2{
  margin-bottom:20px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0d1721;
  color:var(--text);
  outline:none;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  border:1px solid var(--line);
  background:#0d1721;
  color:var(--text);
}

.modal-actions .save{
  background:linear-gradient(135deg,#008cff,#00c6df);
  color:#001018;
  border:none;
}

/* MOBILE */

@media(max-width:1000px){
  .app{
    grid-template-columns:220px 1fr;
  }

  .rightbar{
    display:none;
  }
}

@media(max-width:700px){
  body{
    overflow:auto;
  }

  .app{
    min-height:100vh;
    height:auto;
    display:block;
  }

  .sidebar{
    display:none;
  }

  .main{
    height:100vh;
  }

  .chat{
    padding:18px;
  }

  .welcome{
    margin:40px auto;
  }

  .welcome h1{
    font-size:27px;
  }

  .bubble{
    max-width:90%;
  }

  .header{
    padding:0 15px;
  }

  .input-area{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-dot"></div>
      JARVIS
    </div>

    <div class="status">
      <div class="status-title">Система</div>
      <div class="status-value">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </div>

    <div class="nav">
      <button class="active" onclick="showChat()">💬 Чат</button>
      <button onclick="clearChat()">🗑 Очистить чат</button>
      <button onclick="openSettings()">⚙️ Настройки</button>
      <button onclick="toggleVoice()">🎙 Голос</button>
    </div>

    <div class="profile">
      <div class="profile-name">Иван</div>
      <div class="profile-city">Оренбург</div>
    </div>

  </aside>


  <!-- CENTER -->
  <main class="main">

    <header class="header">
      <div class="header-title">JARVIS AI</div>
      <div class="header-status" id="headerStatus">
        Готов к работе
      </div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="arc"></div>

        <h1>Добро пожаловать</h1>

        <p>
          Я JARVIS — твой AI-помощник.<br>
          Можешь спросить меня о чём угодно.
        </p>

      </div>

    </section>

    <div class="input-area">

      <div class="input-wrap">

        <button class="btn" id="voiceBtn" onclick="toggleVoice()" title="Голос">
          🎙
        </button>

        <textarea
          id="input"
          class="input"
          placeholder="Напиши сообщение..."
          autocomplete="off"
        ></textarea>

        <button
          class="btn send"
          id="sendBtn"
          onclick="handleSend()"
          title="Отправить"
        >
          ➤
        </button>

      </div>

    </div>

  </main>


  <!-- RIGHT -->
  <aside class="rightbar">

    <div class="card">

      <div class="card-title">Время</div>

      <div class="clock" id="clock">
        --:--:--
      </div>

      <div class="date" id="date">
        ---
      </div>

    </div>


    <div class="card">

      <div class="card-title">Погода</div>

      <div class="weather">

        <div class="temp" id="temperature">
          --°
        </div>

        <div class="weather-info">
          <div id="weatherText">Загрузка...</div>
          <div id="weatherCity">Оренбург</div>
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Напоминания
      </div>

      <div id="reminders">
        Нет активных напоминаний
      </div>

    </div>

  </aside>

</div>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">

  <div class="modal-box">

    <h2>Настройки JARVIS</h2>

    <div class="field">
      <label>Proxy URL</label>
      <input
        id="proxyBase"
        placeholder="https://your-proxy.onrender.com"
      >
    </div>

    <div class="field">
      <label>Модель GigaChat</label>
      <input
        id="model"
        value="GigaChat-2-Max"
      >
    </div>

    <div class="field">
      <label>Голос</label>
      <select id="voiceMode">
        <option value="browser">Браузерный голос</option>
        <option value="genvoice">GenVoice через proxy</option>
        <option value="off">Выключен</option>
      </select>
    </div>

    <div class="field">
      <label>Voice ID GenVoice</label>
      <input
        id="voiceId"
        placeholder="например: voice_1"
      >
    </div>

    <div class="modal-actions">

      <button onclick="closeSettings()">
        Отмена
      </button>

      <button class="save" onclick="saveSettings()">
        Сохранить
      </button>

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const DEFAULTS = {
  proxyBase: "https://YOUR-PROXY-URL.onrender.com",
  model: "GigaChat-2-Max",
  voiceMode: "browser",
  voiceId: "",
  city: "Оренбург"
};

const SETTINGS_KEY = "jarvis_settings_v3";
const HISTORY_KEY = "jarvis_history_v3";
const REMINDERS_KEY = "jarvis_reminders_v3";


/* =========================================================
   STATE
========================================================= */

let settings = loadSettings();

let history = loadHistory();

let reminders = loadReminders();

let requestInProgress = false;

let speechRecognition = null;

let voiceListening = false;

let currentSpeech = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendBtn = document.getElementById("sendBtn");

const voiceBtn = document.getElementById("voiceBtn");

const headerStatus = document.getElementById("headerStatus");

const welcome = document.getElementById("welcome");


/* =========================================================
   SETTINGS
========================================================= */

function loadSettings(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(SETTINGS_KEY) || "{}"
      );

    return {
      ...DEFAULTS,
      ...saved
    };

  }catch{

    return {
      ...DEFAULTS
    };

  }

}


function saveSettingsData(){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

}


function openSettings(){

  document.getElementById("proxyBase").value =
    settings.proxyBase;

  document.getElementById("model").value =
    settings.model;

  document.getElementById("voiceMode").value =
    settings.voiceMode;

  document.getElementById("voiceId").value =
    settings.voiceId;

  document
    .getElementById("settingsModal")
    .classList
    .add("show");

}


function closeSettings(){

  document
    .getElementById("settingsModal")
    .classList
    .remove("show");

}


function saveSettings(){

  settings.proxyBase =
    document.getElementById("proxyBase").value.trim();

  settings.model =
    document.getElementById("model").value.trim()
    || DEFAULTS.model;

  settings.voiceMode =
    document.getElementById("voiceMode").value;

  settings.voiceId =
    document.getElementById("voiceId").value.trim();

  settings.proxyBase =
    settings.proxyBase.replace(/\/+$/, "");

  saveSettingsData();

  closeSettings();

  setStatus("Настройки сохранены");

}


/* =========================================================
   STORAGE
========================================================= */

function loadHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );

  }catch{

    return [];

  }

}


function saveHistory(){

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history.slice(-30))
  );

}


function loadReminders(){

  try{

    return JSON.parse(
      localStorage.getItem(REMINDERS_KEY) || "[]"
    );

  }catch{

    return [];

  }

}


function saveReminders(){

  localStorage.setItem(
    REMINDERS_KEY,
    JSON.stringify(reminders)
  );

}


/* =========================================================
   UI
========================================================= */

function setStatus(text){

  headerStatus.textContent = text;

}


function showChat(){

  setStatus("Готов к работе");

}


function addMessage(role, text){

  if(welcome){

    welcome.style.display = "none";

  }

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (role === "user" ? "user" : "ai");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  scrollChat();

  return wrapper;

}


function addError(text){

  if(welcome){

    welcome.style.display = "none";

  }

  const wrapper =
    document.createElement("div");

  wrapper.className = "message error";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  scrollChat();

}


function addTyping(){

  const wrapper =
    document.createElement("div");

  wrapper.className = "message ai";

  wrapper.id = "typing";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble typing";

  bubble.innerHTML =
    "<span></span><span></span><span></span>";

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  scrollChat();

}


function removeTyping(){

  const element =
    document.getElementById("typing");

  if(element){

    element.remove();

  }

}


function scrollChat(){

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================================================
   FETCH WITH TIMEOUT
========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 30000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    return await fetch(
      url,
      {
        ...options,
        signal: controller.signal
      }
    );

  }catch(error){

    if(error.name === "AbortError"){

      throw new Error(
        "Запрос превысил лимит времени."
      );

    }

    throw error;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   JSON HELPER
========================================================= */

async function readJson(response){

  const text =
    await response.text();

  let data = null;

  try{

    data = text
      ? JSON.parse(text)
      : null;

  }catch{

    data = null;

  }

  if(!response.ok){

    const message =
      data?.error ||
      data?.message ||
      text ||
      `HTTP ${response.status}`;

    throw new Error(message);

  }

  return data;

}


/* =========================================================
   WEATHER
========================================================= */

async function loadWeather(){

  const city =
    settings.city || "Оренбург";

  document.getElementById("weatherText")
    .textContent = "Загрузка...";

  try{

    const url =
      `${settings.proxyBase}/weather?city=` +
      encodeURIComponent(city);

    const response =
      await fetchWithTimeout(
        url,
        {},
        10000
      );

    const data =
      await readJson(response);

    if(data?.temperature !== undefined){

      document.getElementById("temperature")
        .textContent =
        Math.round(data.temperature) + "°";

      document.getElementById("weatherText")
        .textContent =
        data.description ||
        "Погода получена";

      document.getElementById("weatherCity")
        .textContent =
        data.city || city;

    }else{

      throw new Error(
        "Сервер не вернул погоду."
      );

    }

  }catch(error){

    console.warn(
      "Weather error:",
      error
    );

    document.getElementById("temperature")
      .textContent = "--°";

    document.getElementById("weatherText")
      .textContent = "Недоступно";

  }

}


/* =========================================================
   WEB SEARCH
========================================================= */

async function callWebSearch(query){

  const url =
    `${settings.proxyBase}/search?q=` +
    encodeURIComponent(query);

  try{

    const response =
      await fetchWithTimeout(
        url,
        {},
        12000
      );

    const data =
      await readJson(response);

    return data;

  }catch(error){

    console.error(
      "Search error:",
      error
    );

    return {
      error:
        "Поиск временно недоступен.",
      details:
        error.message
    };

  }

}


/* =========================================================
   REMINDERS
========================================================= */

function createReminder(text, time){

  const reminder = {

    id:
      Date.now(),

    text:
      text,

    time:
      time,

    created:
      new Date().toISOString()

  };

  reminders.push(reminder);

  saveReminders();

  renderReminders();

  return reminder;

}


function renderReminders(){

  const box =
    document.getElementById("reminders");

  if(!reminders.length){

    box.textContent =
      "Нет активных напоминаний";

    return;

  }

  box.innerHTML = "";

  reminders
    .sort(
      (a,b) =>
        new Date(a.time) -
        new Date(b.time)
    )
    .forEach(reminder => {

      const item =
        document.createElement("div");

      item.className =
        "reminder";

      const date =
        new Date(reminder.time);

      item.innerHTML = `
        <div class="reminder-time">
          ${escapeHtml(
            date.toLocaleString("ru-RU")
          )}
        </div>

        <div>
          ${escapeHtml(reminder.text)}
        </div>

        <button
          class="small-btn"
          onclick="deleteReminder(${reminder.id})"
        >
          Удалить
        </button>
      `;

      box.appendChild(item);

    });

}


function deleteReminder(id){

  reminders =
    reminders.filter(
      x => x.id !== id
    );

  saveReminders();

  renderReminders();

}


/* =========================================================
   FUNCTIONS FOR GIGACHAT
========================================================= */

const FUNCTIONS = [

  {

    name: "web_search",

    description:
      "Ищет свежую информацию в интернете. Используй для новостей, текущих фактов, цен, погоды и другой информации, которая может меняться.",

    parameters: {

      type: "object",

      properties: {

        query: {
          type: "string",
          description:
            "Поисковый запрос"
        }

      },

      required: [
        "query"
      ]

    }

  },

  {

    name: "create_reminder",

    description:
      "Создает локальное напоминание пользователя.",

    parameters: {

      type: "object",

      properties: {

        text: {
          type: "string"
        },

        time: {
          type: "string",
          description:
            "Дата и время ISO 8601"
        }

      },

      required: [
        "text",
        "time"
      ]

    }

  }

];


/* =========================================================
   GIGACHAT
========================================================= */

async function askGigaChat(userText){

  const messages = [

    {

      role: "system",

      content:
`Ты JARVIS — персональный AI-помощник.

Отвечай на русском языке, если пользователь не попросил другой язык.

Будь кратким, понятным и полезным.

Текущая дата:
${new Date().toLocaleDateString("ru-RU")}

Город пользователя:
${settings.city}

Если для ответа нужны свежие данные из интернета — используй web_search.

Не утверждай, что выполнил действие, если инструмент вернул ошибку.`

    },

    ...history,

    {

      role: "user",

      content: userText

    }

  ];


  for(let attempt = 0; attempt < 4; attempt++){

    const response =
      await fetchWithTimeout(

        `${settings.proxyBase}/chat`,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              model:
                settings.model,

              messages,

              functions:
                FUNCTIONS,

              function_call:
                "auto",

              temperature:
                0.7

            })

          },

        30000

      );


    const data =
      await readJson(response);


    const choice =
      data?.choices?.[0];

    const message =
      choice?.message;


    if(!message){

      throw new Error(
        "GigaChat не вернул сообщение."
      );

    }


    /* FUNCTION CALL */

    if(message.function_call){

      let args = {};

      try{

        args =
          typeof message.function_call.arguments === "string"
            ? JSON.parse(
                message.function_call.arguments
              )
            : (
                message.function_call.arguments || {}
              );

      }catch{

        args = {};

      }


      const functionName =
        message.function_call.name;


      let result;


      if(functionName === "web_search"){

        result =
          await callWebSearch(
            args.query || userText
          );

      }

      else if(
        functionName === "create_reminder"
      ){

        result =
          createReminder(
            args.text ||
              "Напоминание",

            args.time ||
              new Date(
                Date.now() + 3600000
              ).toISOString()
          );

      }

      else{

        result = {
          error:
            "Неизвестная функция."
        };

      }


      messages.push(message);


      messages.push({

        role: "function",

        name:
          functionName,

        content:
          JSON.stringify(result)

      });


      continue;

    }


    const answer =
      message.content ||
      "Я не получил текстовый ответ.";


    return answer;

  }


  throw new Error(
    "Не удалось завершить запрос к GigaChat."
  );

}


/* =========================================================
   SEND
========================================================= */

async function handleSend(){

  if(requestInProgress){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    !settings.proxyBase ||
    settings.proxyBase.includes(
      "YOUR-PROXY"
    )
  ){

    addError(
      "Сначала укажи Proxy URL в ⚙️ Настройках."
    );

    openSettings();

    return;

  }


  requestInProgress = true;

  sendBtn.disabled = true;

  input.disabled = true;

  setStatus("Обработка запроса...");


  addMessage(
    "user",
    text
  );


  input.value = "";


  history.push({

    role:"user",

    content:text

  });


  saveHistory();


  addTyping();


  try{

    const answer =
      await askGigaChat(text);


    removeTyping();


    addMessage(
      "ai",
      answer
    );


    history.push({

      role:"assistant",

      content:answer

    });


    saveHistory();


    await speak(answer);

    setStatus("Готов к работе");

  }catch(error){

    console.error(
      error
    );

    removeTyping();


    addError(
      "Не удалось получить ответ.\n\n" +
      getFriendlyError(error)
    );


    setStatus(
      "Ошибка соединения"
    );

  }finally{

    requestInProgress =
      false;

    sendBtn.disabled =
      false;

    input.disabled =
      false;

    input.focus();

  }

}


/* =========================================================
   ERROR TEXT
========================================================= */

function getFriendlyError(error){

  const message =
    error?.message ||
    "Неизвестная ошибка";


  if(
    message.includes(
      "превысил лимит"
    )
  ){

    return (
      "Сервер слишком долго отвечает. " +
      "Проверь Proxy и интернет-соединение."
    );

  }


  if(
    message.includes(
      "Failed to fetch"
    )
  ){

    return (
      "Не удалось подключиться к Proxy. " +
      "Проверь адрес Proxy и CORS."
    );

  }


  return message;

}


/* =========================================================
   VOICE
========================================================= */

async function speak(text){

  if(
    settings.voiceMode === "off"
  ){

    return;

  }


  stopSpeaking();


  if(
    settings.voiceMode === "genvoice"
  ){

    if(!settings.voiceId){

      return;

    }


    try{

      const response =
        await fetchWithTimeout(

          `${settings.proxyBase}/tts`,

          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                text,

                voice_id:
                  settings.voiceId,

                output_format:
                  "mp3"

              })

          },

          15000

        );


      if(!response.ok){

        throw new Error(
          "GenVoice error"
        );

      }


      const blob =
        await response.blob();


      const url =
        URL.createObjectURL(blob);


      const audio =
        new Audio(url);


      currentSpeech =
        audio;


      audio.onended =
        () => {

          URL.revokeObjectURL(url);

          currentSpeech =
            null;

        };


      await audio.play();


      return;

    }catch(error){

      console.warn(
        "GenVoice error:",
        error
      );

      /* fallback */

    }

  }


  /* Browser TTS */

  if(
    "speechSynthesis" in window
  ){

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      "ru-RU";

    utterance.rate =
      1;

    utterance.pitch =
      1;

    currentSpeech =
      utterance;

    speechSynthesis.speak(
      utterance
    );

  }

}


function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }


  if(
    currentSpeech &&
    currentSpeech.pause
  ){

    try{

      currentSpeech.pause();

    }catch{}

  }


  currentSpeech =
    null;

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function initSpeechRecognition(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    return null;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    "ru-RU";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    () => {

      voiceListening =
        true;

      voiceBtn.textContent =
        "⏹";

      setStatus(
        "Слушаю..."
      );

    };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript;


      input.value =
        transcript;


      setTimeout(
        () => handleSend(),
        100
      );

    };


  recognition.onerror =
    event => {

      console.warn(
        "Speech error:",
        event.error
      );

      voiceListening =
        false;

      voiceBtn.textContent =
        "🎙";

      setStatus(
        "Готов к работе"
      );

    };


  recognition.onend =
    () => {

      voiceListening =
        false;

      voiceBtn.textContent =
        "🎙";

      if(
        !requestInProgress
      ){

        setStatus(
          "Готов к работе"
        );

      }

    };


  return recognition;

}


speechRecognition =
  initSpeechRecognition();


function toggleVoice(){

  if(!speechRecognition){

    addError(
      "Распознавание речи не поддерживается этим браузером."
    );

    return;

  }


  if(voiceListening){

    try{

      speechRecognition.stop();

    }catch{}

    return;

  }


  stopSpeaking();


  try{

    speechRecognition.start();

  }catch(error){

    console.warn(
      error
    );

  }

}

========================================================= */

  document.getElementById("clock")

        "ru-RU"
      );

        }
      );

}


setInterval(

);

updateClock();


/* =========================================================
   REMINDER CHECKER
========================================================= */

setInterval(
  checkReminders,
  10000
);


function checkReminders(){

  const now =
    Date.now();


  const due =
    reminders.filter(
      reminder =>
        new Date(reminder.time)
          .getTime() <= now
    );


  if(!due.length){

    return;

  }


  due.forEach(
    reminder => {

      addMessage(
        "ai",
        "🔔 Напоминание: " +
        reminder.text
      );


      speak(
        "Напоминание: " +
        reminder.text
      );

    }
  );


  const dueIds =
    new Set(
      due.map(
        x => x.id
      )
    );


  reminders =
    reminders.filter(
      x => !dueIds.has(x.id)
    );


  saveReminders();

  renderReminders();

}

  saveHistory();

    "welcome";

  element.innerHTML = `
    <div class="arc"></div>

    <h1>Чат очищен</h1>

    <p>

    </p>
  `;

  chat.appendChild(element);

  setStatus(
    "Готов к работе"
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

   ENTER
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      handleSend();

    }

  }
);
